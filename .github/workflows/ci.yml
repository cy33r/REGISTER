# REGISTER: builds and tests both apps on every push to main.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TETHER_MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint, release builds
        working-directory: android
        run: >
          ./gradlew --console=plain
          :core:testDebugUnitTest :app:testDebugUnitTest :helper:testDebugUnitTest :client:testDebugUnitTest
          :app:lintRelease :client:lintRelease
          :app:assembleRelease :helper:assembleRelease :client:assembleRelease
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: android/*/build/reports/

  iphone:
    name: iPhone
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate --quiet
      - name: iPhone app build (Release, unsigned)
        working-directory: ios
        run: >
          xcodebuild -project Tether.xcodeproj -scheme Tether -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build -skipMacroValidation CODE_SIGNING_ALLOWED=NO build -quiet
